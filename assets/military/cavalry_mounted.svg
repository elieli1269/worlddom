<svg xmlns="http://www.w3.org/2000/svg" width="96" height="80" viewBox="0 0 96 80">
  <!-- Ground Shadow -->
  <ellipse cx="50" cy="72" rx="38" ry="7" fill="#000000" opacity="0.32"/>

  <!-- Warhorse (White / Gray stallion) -->
  <g transform="translate(18, 22)">
    <!-- Horse Body -->
    <ellipse cx="32" cy="30" rx="20" ry="12" fill="#ecf0f1"/>
    <!-- Horse Chest & Neck -->
    <path d="M42 30 C46 25, 48 10, 52 4 C50 2, 45 6, 40 16 C36 24, 38 28, 42 30 Z" fill="#ffffff"/>
    <!-- Horse Head & Muzzle -->
    <polygon points="52,4 58,10 52,15 48,8" fill="#ecf0f1"/>
    <polygon points="56,10 57,12 53,14" fill="#d2dae2"/>
    <!-- Horse Ears -->
    <polygon points="50,4 52,0 54,4" fill="#bdc3c7"/>
    <!-- Horse Mane (Dark gray/black wavy) -->
    <path d="M42 12 Q40 8 44 6 Q42 3 46 2 Q48 1 50 3" stroke="#2c3e50" stroke-width="2" fill="none"/>
    <!-- Horse Legs -->
    <!-- Front Left (Stepping forward) -->
    <polygon points="46,36 50,48 54,48 50,36" fill="#ffffff"/>
    <polygon points="50,48 52,56 49,56 48,48" fill="#dfe6e9"/>
    <rect x="48" y="55" width="4.5" height="3" fill="#2d3436"/> <!-- Hoof -->
    <!-- Front Right -->
    <polygon points="42,36 44,48 48,48 46,36" fill="#b2bec3"/>
    <rect x="43" y="54" width="4" height="3" fill="#2d3436"/>
    <!-- Hind Left (Powerful rear hock) -->
    <path d="M20 32 C16 38, 14 46, 17 56 L20 56 C18 48, 20 40, 24 35 Z" fill="#dfe6e9"/>
    <rect x="16" y="55" width="4" height="3" fill="#2d3436"/>
    <!-- Hind Right -->
    <path d="M24 32 C21 38, 20 46, 23 56 L26 56 C24 48, 25 40, 28 35 Z" fill="#b2bec3"/>
    <rect x="22" y="55" width="4" height="3" fill="#2d3436"/>
    <!-- Horse Tail (Flowing white) -->
    <path d="M14 26 C8 32, 6 45, 10 54 C12 46, 12 36, 16 30 Z" fill="#ffffff"/>

    <!-- Saddle and Shabrack / Saddlecloth (Royal blue with gold lace) -->
    <polygon points="26,24 38,22 40,32 24,32" fill="#0984e3" stroke="#f1c40f" stroke-width="1"/>
    <!-- Stirrup & Girth -->
    <line x1="33" y1="32" x2="33" y2="44" stroke="#f1c40f" stroke-width="1.2"/>
    <ellipse cx="33" cy="45" rx="2" ry="1.2" fill="#b2bec3"/>

    <!-- Bridle & Reins (Leather straps) -->
    <line x1="53" y1="12" x2="42" y2="24" stroke="#d63031" stroke-width="1"/>
    <line x1="51" y1="6" x2="55" y2="10" stroke="#d63031" stroke-width="0.8"/>

    <!-- MOUNTED CAVALRY OFFICER / CUIRASSIER -->
    <!-- Legs with tall black boots -->
    <polygon points="31,26 35,26 36,42 31,42" fill="#2d3436"/>
    <!-- Polished Steel Cuirass (Breastplate armor reflecting light) -->
    <path d="M28 12 L38 12 L37 26 L29 26 Z" fill="#f5f6fa" stroke="#f1c40f" stroke-width="1.2"/>
    <polygon points="31,13 36,13 35,24 32,24" fill="#ffffff"/> <!-- Mirror highlight -->
    <!-- Red collar / epaulettes -->
    <circle cx="28" cy="13" r="2" fill="#d63031"/>
    <circle cx="38" cy="13" r="2" fill="#d63031"/>
    <!-- Head and Helmet -->
    <circle cx="33" cy="8" r="3.5" fill="#f5cd79"/>
    <!-- Brass/Steel Helmet with Horsehair Crest -->
    <path d="M30 6 C30 1, 36 1, 36 6 Z" fill="#f1c40f" stroke="#e17055" stroke-width="0.8"/>
    <!-- Black horsehair flowing crest -->
    <path d="M33 1 C30 -4, 25 2, 23 10" stroke="#2d3436" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Cavalry Saber / Sword held high -->
    <line x1="36" y1="16" x2="52" y2="-4" stroke="#bdc3c7" stroke-width="1.8"/>
    <line x1="36" y1="16" x2="38" y2="14" stroke="#f1c40f" stroke-width="3"/> <!-- Brass hilt -->
  </g>
</svg>
