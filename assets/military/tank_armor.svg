<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Outer tactical frame -->
  <circle cx="32" cy="32" r="30" fill="#142633" stroke="#d5b364" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="26.5" fill="#1b3446" stroke="#48697b" stroke-width="1.2"/>
  
  <!-- Tank Tracks base -->
  <!-- Outer track contour -->
  <rect x="12" y="38" width="40" height="13" rx="6.5" fill="#1e2d36" stroke="#d5b364" stroke-width="1.5"/>
  <!-- Road wheels -->
  <circle cx="18" cy="44.5" r="3.5" fill="#3f5866" stroke="#a2b7bf" stroke-width="1.2"/>
  <circle cx="25" cy="44.5" r="3.5" fill="#3f5866" stroke="#a2b7bf" stroke-width="1.2"/>
  <circle cx="32" cy="44.5" r="3.5" fill="#3f5866" stroke="#a2b7bf" stroke-width="1.2"/>
  <circle cx="39" cy="44.5" r="3.5" fill="#3f5866" stroke="#a2b7bf" stroke-width="1.2"/>
  <circle cx="46" cy="44.5" r="3.5" fill="#3f5866" stroke="#a2b7bf" stroke-width="1.2"/>
  <!-- Return roller / track tread teeth -->
  <line x1="14" y1="41" x2="14" y2="48" stroke="#8ba0aa" stroke-width="1"/>
  <line x1="50" y1="41" x2="50" y2="48" stroke="#8ba0aa" stroke-width="1"/>

  <!-- Hull / Chassis -->
  <path d="M15 39 L19 32 L45 32 L49 39 Z" fill="#4d5c4b" stroke="#d5b364" stroke-width="1.5"/>
  <!-- Front mudguard and rear exhaust -->
  <line x1="14" y1="36" x2="20" y2="33" stroke="#e8cb78" stroke-width="1.5"/>

  <!-- Cannon / Main Gun Barrel -->
  <rect x="36" y="24" width="22" height="3" rx="1" fill="#2d3d37" stroke="#e8cb78" stroke-width="1"/>
  <!-- Muzzle brake -->
  <rect x="56" y="23" width="3" height="5" rx="1" fill="#e8cb78"/>
  <line x1="37" y1="25.5" x2="56" y2="25.5" stroke="#a0b8af" stroke-width="1"/>

  <!-- Turret -->
  <path d="M22 32 C22 24, 27 22, 33 22 L40 22 C43 22, 45 25, 43 32 Z" fill="#3a4f40" stroke="#d5b364" stroke-width="1.5"/>
  <!-- Commander Cupola / Hatch -->
  <ellipse cx="28" cy="21" rx="4" ry="2" fill="#26382b" stroke="#e8cb78" stroke-width="1.2"/>
  <!-- Armor plate line -->
  <path d="M30 24 L30 31" stroke="#25352a" stroke-width="1.2"/>
</svg>
