  <path d="M31 20 L31 23" stroke="#e8cb78" stroke-width="1.5"/>
  
  <!-- Star insignia -->
  <path d="M32 44 L33.2 47.5 L36.8 47.5 L33.9 49.6 L35 53 L32 50.8 L29 53 L30.1 49.6 L27.2 47.5 L30.8 47.5 Z" fill="#e8cb78"/>
