<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Outer tactical frame -->
  <circle cx="32" cy="32" r="30" fill="#142633" stroke="#d5b364" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="26.5" fill="#1b3446" stroke="#48697b" stroke-width="1.2"/>

  <!-- Cannon carriage / trail spade (ground anchor) -->
  <path d="M12 50 L27 42 L25 38 L10 47 Z" fill="#32454a" stroke="#d5b364" stroke-width="1.3"/>
  <circle cx="11" cy="49" r="2" fill="#d5b364"/>

  <!-- Gun barrel (elevated at 35 degrees) -->
  <!-- Long tube -->
  <path d="M22 36 L49 19 L52 24 L25 41 Z" fill="#465c63" stroke="#d5b364" stroke-width="1.5"/>
  <!-- Breech block -->
  <rect x="20" y="36" width="7" height="7" transform="rotate(-30 23.5 39.5)" fill="#2c3a3e" stroke="#e8cb78" stroke-width="1.2"/>
  <!-- Muzzle ring -->
  <path d="M48 17 L54 21 L52 24 L46 20 Z" fill="#e8cb78" stroke="#d5b364" stroke-width="1"/>
  <!-- Recoil cylinder under barrel -->
  <path d="M28 36 L43 27 L44 29 L29 38 Z" fill="#243438" stroke="#879fa8" stroke-width="1"/>

  <!-- Gunner Shield (armor plate protecting crew) -->
  <path d="M30 25 L36 21 L34 43 L28 45 Z" fill="#4f686d" stroke="#e8cb78" stroke-width="1.5"/>

  <!-- Heavy spoked Artillery Wheel -->
  <circle cx="28" cy="44" r="10" fill="#22333b" stroke="#d5b364" stroke-width="2"/>
  <circle cx="28" cy="44" r="8" fill="#1a272e" stroke="#4a6673" stroke-width="1"/>
  <circle cx="28" cy="44" r="3" fill="#e8cb78" stroke="#22333b" stroke-width="1"/>
  <!-- Spokes -->
  <line x1="28" y1="36" x2="28" y2="52" stroke="#d5b364" stroke-width="1.2"/>
  <line x1="20" y1="44" x2="36" y2="44" stroke="#d5b364" stroke-width="1.2"/>
  <line x1="22.3" y1="38.3" x2="33.7" y2="49.7" stroke="#d5b364" stroke-width="1.2"/>
  <line x1="22.3" y1="49.7" x2="33.7" y2="38.3" stroke="#d5b364" stroke-width="1.2"/>

  <!-- Fired shell / burst icon in corner -->
  <circle cx="50" cy="14" r="2.5" fill="#e8cb78"/>
  <path d="M48 10 L52 18 M46 14 L54 14" stroke="#e8cb78" stroke-width="1"/>
</svg>
